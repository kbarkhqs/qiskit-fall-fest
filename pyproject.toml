[project]
name = "qiskit-fall-fest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jona-sh", email = "jonas-hoepker@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pylatexenc>=2.11",
    "qiskit>=2.2,<3",
    "qiskit-ibm-runtime>=0.52.0",
    "scipy>=1.18.1",
    "struqture-py>=2.6.0",
]

[project.scripts]
qiskit-fall-fest = "qiskit_fall_fest:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
